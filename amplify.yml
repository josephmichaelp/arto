version: 1
env:
  variables:
    AWS_REGION: ap-southeast-1
    BEDROCK_REGION: ap-southeast-3
backend:
  phases:
    build:
      commands:
        - npm ci
        # verify:bedrock dijalankan manual setelah deploy pertama berhasil.
        # Aktifkan kembali kondisi ini setelah IAM role Amplify diberi izin Bedrock.
        - echo "Melewati verifikasi Bedrock - jalankan manual: npm run verify:bedrock"
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*